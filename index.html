<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopKart</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
}

/* Navbar */
.navbar {
    background: #2874f0;
    color: white;
    display: flex;
    align-items: center;
    padding: 10px 20px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.search-box {
    flex: 1;
    margin: 0 20px;
}

.search-box input {
    width: 100%;
    padding: 8px;
    border-radius: 4px;
    border: none;
}

.nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
}

/* Categories */
.categories {
    display: flex;
    justify-content: space-around;
    background: white;
    padding: 10px;
}

.categories div {
    text-align: center;
    cursor: pointer;
    font-size: 14px;
}

/* Banner */
.banner {
    width: 100%;
    height: 250px;
    background: url('https://via.placeholder.com/1200x250') no-repeat center/cover;
    margin-bottom: 20px;
}

/* Products */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 6px;
    transition: 0.2s;
}

.product:hover {
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 150px;
    object-fit: contain;
}

.product h4 {
    margin: 10px 0;
}

.price {
    color: green;
    font-weight: bold;
}

button {
    background: #fb641b;
    border: none;
    padding: 8px;
    color: white;
    width: 100%;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background: #e55b16;
}

/* Footer */
footer {
    background: #172337;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
}
</style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">
    <div class="logo">ShopKart</div>
    <div class="search-box">
        <input type="text" placeholder="Search for products...">
    </div>
    <div class="nav-links">
        <a href="#">Login</a>
        <a href="#">Cart 🛒</a>
    </div>
</div>

<!-- Categories -->

<div class="categories">
    <div>Mobiles</div>
    <div>Fashion</div>
    <div>Electronics</div>
    <div>Home</div>
    <div>Appliances</div>
    <div>Travel</div>
</div>

<!-- Banner -->

<div class="banner"></div>

<!-- Products -->

<div class="products">

```
<div class="product">
    <img src="https://via.placeholder.com/150">
    <h4>Smartphone</h4>
    <p class="price">₹12,999</p>
    <button>Add to Cart</button>
</div>

<div class="product">
    <img src="https://via.placeholder.com/150">
    <h4>Laptop</h4>
    <p class="price">₹45,000</p>
    <button>Add to Cart</button>
</div>

<div class="product">
    <img src="https://via.placeholder.com/150">
    <h4>Headphones</h4>
    <p class="price">₹1,999</p>
    <button>Add to Cart</button>
</div>

<div class="product">
    <img src="https://via.placeholder.com/150">
    <h4>Shoes</h4>
    <p class="price">₹2,499</p>
    <button>Add to Cart</button>
</div>
```

</div>

<footer>
    <p>© 2026 ShopKart | Inspired UI</p>
</footer>

</body>
</html>
